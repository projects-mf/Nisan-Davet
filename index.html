<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sümeyye & Yakup - Söz Davetiyesi</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --blue-deep: #0e1a2b;
      --blue-main: #132438;
      --blue-mid: #1d3557;
      --blue-soft: #2a486c;
      --gold-line: #c5a059;
      --gold-dark: #8c6a28;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ede9e3;
      font-family: 'Montserrat', sans-serif;
      color: var(--blue-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px 8px;
      overflow-x: hidden;
    }

    /* 3D Sahne Alanı */
    .scene-container {
      position: relative;
      width: 100%;
      max-width: 460px;
      min-height: 740px;
      perspective: 1600px;
      overflow: hidden;
      border-radius: 26px;
      box-shadow: 0 22px 55px rgba(0, 0, 0, 0.22);
      cursor: pointer;
    }

    /* === AÇILIR KAPI KATMANI === */
    .door-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      pointer-events: auto;
      transition: visibility 2.2s ease;
    }

    .door {
      width: 50%;
      height: 100%;
      background: linear-gradient(145deg, #1b2838 0%, #0d1522 100%);
      position: relative;
      transition: transform 2.2s cubic-bezier(0.25, 1, 0.5, 1);
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      border: 1px solid rgba(197, 160, 89, 0.2);
    }

    .door-left {
      transform-origin: left center;
      border-right: 1px solid rgba(197, 160, 89, 0.4);
    }

    .door-right {
      transform-origin: right center;
      border-left: 1px solid rgba(197, 160, 89, 0.4);
      justify-content: flex-end;
    }

    .door-frame-deco {
      position: absolute;
      top: 24px;
      bottom: 24px;
      border: 1px solid rgba(197, 160, 89, 0.35);
      border-radius: 12px;
      pointer-events: none;
    }

    .door-left .door-frame-deco {
      left: 18px;
      right: 10px;
    }

    .door-right .door-frame-deco {
      left: 10px;
      right: 18px;
    }

    /* Kapı Üzerindeki Mühür */
    .door-seal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle, #f9f2dd 0%, #d4b068 60%, #8c6a28 100%);
      border: 3px solid #f3e5be;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 2px 6px rgba(255, 255, 255, 0.6);
      z-index: 15;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease, transform 0.8s ease;
      animation: pulseGlow 2.5s infinite ease-in-out;
    }

    .seal-monogram {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.55rem;
      font-weight: 700;
      color: #3d2c0b;
      letter-spacing: 3px;
      line-height: 1;
      text-shadow: 0 1px 1px rgba(255, 255, 255, 0.7);
    }

    .seal-tap-text {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.52rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #4a3814;
      margin-top: 6px;
      font-weight: 600;
      opacity: 0.85;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 8px 25px rgba(0,0,0,0.5), 0 0 15px rgba(212, 176, 104, 0.3); }
      50% { transform: translate(-50%, -50%) scale(1.04); box-shadow: 0 12px 35px rgba(0,0,0,0.6), 0 0 25px rgba(212, 176, 104, 0.6); }
    }

    /* KAPI AÇILMA ANİMASYONU */
    .scene-container.opened .door-left {
      transform: rotateY(-115deg);
    }

    .scene-container.opened .door-right {
      transform: rotateY(115deg);
    }

    .scene-container.opened .door-seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.6);
      pointer-events: none;
    }

    .scene-container.opened .door-wrapper {
      pointer-events: none;
    }

    /* === DAVETİYE KARTI === */
    .card-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 740px;
      background: #faf8f5;
      overflow: hidden;
      transform: scale(0.96);
      transition: transform 2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .scene-container.opened .card-wrapper {
      transform: scale(1);
    }

    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      z-index: 1;
      pointer-events: none;
    }

    .card-content {
      position: relative;
      z-index: 2;
      padding: 76px 44px 52px 44px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 740px;
    }

    .top-badge {
      font-family: 'Cinzel', serif;
      font-size: 0.76rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--blue-soft);
      font-weight: 600;
      margin-bottom: 8px;
    }

    /* Çapraz İsimler: Sümeyye Üstte, Yakup Altta */
    .couple-diagonal {
      position: relative;
      width: 100%;
      margin: 10px 0 14px 0;
    }

    .name-left {
      text-align: left;
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.85rem;
      font-weight: 700;
      line-height: 1.2;
      color: var(--blue-deep);
      padding-left: 40px;
      letter-spacing: 1px;
    }

    .ampersand {
      text-align: center;
      font-family: 'Cinzel', serif;
      font-size: 1.35rem;
      color: var(--gold-line);
      margin: -2px 0;
      font-style: italic;
    }

    .name-right {
      text-align: right;
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.85rem;
      font-weight: 700;
      line-height: 1.2;
      color: var(--blue-deep);
      padding-right: 50px;
      letter-spacing: 1px;
    }

    .invite-text {
      font-size: 0.76rem;
      line-height: 1.6;
      color: var(--blue-soft);
      font-style: italic;
      margin: 0 auto;
      max-width: 92%;
    }

    .gold-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 4px 0;
      width: 100%;
    }

    .gold-divider span {
      height: 1px;
      width: 40px;
      background: linear-gradient(90deg, transparent, var(--gold-line), transparent);
    }

    .gold-divider i {
      color: var(--gold-line);
      font-size: 0.55rem;
    }

    /* Geri Sayım */
    .countdown-title {
      font-family: 'Cinzel', serif;
      font-size: 0.68rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--blue-main);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .countdown-container {
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .time-box {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(19, 36, 56, 0.2);
      border-radius: 8px;
      padding: 6px 4px;
      min-width: 48px;
      box-shadow: 0 4px 10px rgba(14, 26, 43, 0.05);
    }

    .time-num {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--blue-deep);
      display: block;
      line-height: 1;
      margin-bottom: 2px;
    }

    .time-label {
      font-size: 0.52rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--blue-soft);
      font-weight: 500;
    }

    /* Mekan Bilgisi */
    .event-info {
      width: 100%;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 12px;
      border: 1px solid rgba(197, 160, 89, 0.35);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: center;
    }

    .info-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--blue-deep);
      font-weight: 500;
    }

    .info-line i {
      color: var(--gold-dark);
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .info-date {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      color: var(--blue-deep);
      letter-spacing: 0.5px;
    }

    /* Butonlar */
    .actions-container {
      display: flex;
      flex-direction: column;
      gap: 7px;
      width: 100%;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-decoration: none;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, #1d3557 0%, #0e1a2b 100%);
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 12px rgba(14, 26, 43, 0.3);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #132438 0%, #080f1a 100%);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.9);
      color: var(--blue-deep);
      border: 1px solid rgba(29, 53, 87, 0.35);
    }

    .btn-secondary:hover {
      background: #ffffff;
    }

    footer {
      font-size: 0.65rem;
      color: var(--blue-soft);
      letter-spacing: 0.8px;
    }

    @media (max-width: 400px) {
      .card-content {
        padding: 68px 28px 46px 28px;
      }
      .name-left, .name-right {
        font-size: 1.55rem;
      }
      .time-box {
        min-width: 44px;
      }
    }
  </style>
</head>
<body>

  <div class="scene-container" id="inviteScene" onclick="openInvitation()">
    
    <!-- 1. GİRİŞ KAPISI KATMANI -->
    <div class="door-wrapper" id="doorLayer">
      <div class="door door-left">
        <div class="door-frame-deco"></div>
      </div>

      <!-- Ortadaki Mühür (S • Y) -->
      <div class="door-seal">
        <div class="seal-monogram">S &bull; Y</div>
      </div>

      <div class="door door-right">
        <div class="door-frame-deco"></div>
      </div>
    </div>

    <!-- 2. ANA DAVETİYE KARTI -->
    <main class="card-wrapper">
      <img src="https://raw.githubusercontent.com/projects-mf/Nisan-Davet/main/background.jpg" 
     alt="Çiçekli Çerçeve" 
     class="bg-image">

      <div class="card-content">
        <div>
          <div class="top-badge">Birlikteliğe İlk Adım</div>
        </div>

        <!-- Üstte Sümeyye, Altta Yakup -->
        <div class="couple-diagonal">
          <div class="name-left">Sümeyye</div>
          <div class="ampersand">&amp;</div>
          <div class="name-right">Yakup</div>
        </div>

        <p class="invite-text">
          Bu mutlu günümüzde siz değerli sevdiklerimizi aramızda görmekten onur duyarız.
        </p>

        <div class="gold-divider">
          <span></span>
          <i class="fa-solid fa-diamond"></i>
          <span></span>
        </div>

        <div>
          <div class="countdown-title">Geri Sayım</div>
          <div class="countdown-container">
            <div class="time-box">
              <span class="time-num" id="days">00</span>
              <span class="time-label">Gün</span>
            </div>
            <div class="time-box">
              <span class="time-num" id="hours">00</span>
              <span class="time-label">Saat</span>
            </div>
            <div class="time-box">
              <span class="time-num" id="minutes">00</span>
              <span class="time-label">Dk</span>
            </div>
            <div class="time-box">
              <span class="time-num" id="seconds">00</span>
              <span class="time-label">Sn</span>
            </div>
          </div>
        </div>

        <!-- Mekan Bilgisi (Açık Adres) -->
        <div class="event-info">
          <div class="info-line">
            <i class="fa-regular fa-calendar-check"></i>
            <span class="info-date">24 EKİM 2026 &bull; 19:30</span>
          </div>
          <div class="info-line">
            <i class="fa-solid fa-location-dot"></i>
            <span>Masal Düğün Davet Salonu, Batman</span>
          </div>
        </div>

        <!-- Butonlar (Doğrudan Masal Düğün Davet Salonu Açık Adres Araması) -->
        <div class="actions-container">
          <a href="https://www.google.com/maps/search/?api=1&query=Masal+Düğün+Davet+Salonu+Gültepe+Beşikçi+Cd+Batman" target="_blank" class="btn btn-primary" onclick="event.stopPropagation();">
            <i class="fa-solid fa-location-arrow"></i> Konuma Git (Harita)
          </a>
          <a id="calendarLink" href="#" target="_blank" class="btn btn-secondary" onclick="event.stopPropagation();">
            <i class="fa-regular fa-calendar-plus"></i> Takvime Ekle
          </a>
        </div>

        <footer>
          Tüm sevdiklerimiz davetlidir.
        </footer>
      </div>
    </main>
  </div>

  <script>
    function openInvitation() {
  const scene = document.getElementById('inviteScene');
  if (!scene.classList.contains('opened')) {
    scene.classList.add('opened');

    // Ekrana tıklandığı an tam ekrana geçiş tetikleme
    const docElm = document.documentElement;
    if (docElm.requestFullscreen) {
      docElm.requestFullscreen().catch(() => {});
    } else if (docElm.webkitRequestFullscreen) { /* Safari / iOS */
      docElm.webkitRequestFullscreen();
    } else if (docElm.msRequestFullscreen) { /* IE/Edge */
      docElm.msRequestFullscreen();
    }
  }
}

    const targetDate = new Date(2026, 9, 24, 19, 30, 0).getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance < 0) {
        document.querySelector('.countdown-container').innerHTML = 
          "<p style='color: var(--blue-deep); font-weight: 700; font-family: Cinzel, serif;'>Kutlama Başladı!</p>";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById("days").innerText = days < 10 ? "0" + days : days;
      document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
      document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
      document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    // Google Takvim Linki (Tam Açık Adres ve Maps Bağlantılı)
    const eventTitle = encodeURIComponent("Sümeyye & Yakup Nişan Töreni");
    const eventDetails = encodeURIComponent("Sümeyye & Yakup çiftinin Nişan Törenine davetlisiniz.\n\nMekan: Masal Düğün Davet Salonu\nAdres: Gültepe, Beşikçi Cd., 72050 Batman Merkez/Batman");
    const eventLocation = encodeURIComponent("Masal Düğün Davet Salonu, Gültepe, Beşikçi Cd., 72050 Batman Merkez/Batman");
    const calDates = "20261024T163000Z/20261024T200000Z";

    document.getElementById("calendarLink").href = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${eventTitle}&dates=${calDates}&details=${eventDetails}&location=${eventLocation}`;
  </script>
</body>
</html>
